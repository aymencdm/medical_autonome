name: face_tracker_viewer
description: Desktop viewer for RTP stream from Raspberry Pi face tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  socket_io_client: ^2.0.2
  http: ^1.1.0
  provider: ^6.1.1
  window_manager: ^0.3.7
  # sqflite_common_ffi: ^2.3.0  # Temporarily disabled - will implement shared_preferences instead
  path: ^1.8.3
  path_provider: ^2.1.1
  # image_picker: ^1.0.4  # Temporarily disabled
  # camera: ^0.10.5  # Temporarily disabled

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true


