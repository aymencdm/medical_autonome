<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Tracking System</title>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252542;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        header {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 20px;
            font-size: 0.875rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.active {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }
        
        .status-dot.inactive {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Main Content */
        main {
            flex: 1;
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        /* Video Container */
        .video-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .video-container {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .video-container img {
            width: 100%;
            display: block;
        }
        
        .video-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        
        .live-badge {
            background: var(--danger);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .resolution-badge {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        
        /* Control Panel */
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 350px;
        }
        
        .panel-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        
        .panel-card h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Servo Gauges */
        .servo-gauges {
            display: flex;
            gap: 1rem;
        }
        
        .gauge {
            flex: 1;
            text-align: center;
        }
        
        .gauge-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 0.75rem;
            border-radius: 50%;
            background: conic-gradient(
                var(--accent-primary) 0deg,
                var(--accent-primary) var(--angle),
                var(--bg-tertiary) var(--angle)
            );
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .gauge-circle::before {
            content: '';
            width: 75px;
            height: 75px;
            background: var(--bg-secondary);
            border-radius: 50%;
            position: absolute;
        }
        
        .gauge-value {
            position: relative;
            z-index: 1;
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .gauge-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        /* Toggle Switches */
        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }
        
        .toggle-label {
            font-size: 0.9rem;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--bg-primary);
            border-radius: 26px;
            transition: 0.3s;
        }
        
        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        
        .toggle-switch input:checked + .toggle-slider {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }
        
        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(24px);
        }
        
        /* Buttons */
        .button-group {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* Manual Control */
        .joystick-container {
            display: flex;
            justify-content: center;
            padding: 1rem;
        }
        
        .joystick {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }
        
        .joystick-btn {
            background: var(--bg-tertiary);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        
        .joystick-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }
        
        .joystick-btn:active {
            transform: scale(0.95);
        }
        
        .joystick-btn.center {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
        }
        
        /* Info Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        
        .stat-item {
            background: var(--bg-tertiary);
            padding: 0.75rem;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-primary);
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }
        
        /* Footer */
        footer {
            padding: 1rem 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            main {
                flex-direction: column;
            }
            
            .control-panel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">👁️</div>
            <h1>Face Tracker</h1>
        </div>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </header>
    
    <main>
        <section class="video-section">
            <div class="video-container">
                <img src="/video_feed" alt="Camera Feed" id="videoFeed">
                <div class="video-overlay">
                    <span class="live-badge">● LIVE</span>
                    <span class="resolution-badge">640x480</span>
                </div>
            </div>
        </section>
        
        <aside class="control-panel">
            <!-- Servo Position -->
            <div class="panel-card">
                <h3>📍 Servo Position</h3>
                <div class="servo-gauges">
                    <div class="gauge">
                        <div class="gauge-circle" id="panGauge" style="--angle: 180deg;">
                            <span class="gauge-value" id="panValue">90°</span>
                        </div>
                        <div class="gauge-label">Pan (Horizontal)</div>
                    </div>
                    <div class="gauge">
                        <div class="gauge-circle" id="tiltGauge" style="--angle: 180deg;">
                            <span class="gauge-value" id="tiltValue">90°</span>
                        </div>
                        <div class="gauge-label">Tilt (Vertical)</div>
                    </div>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="panel-card">
                <h3>⚙️ Controls</h3>
                <div class="toggle-group">
                    <div class="toggle-item">
                        <span class="toggle-label">Face Tracking</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="trackingToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="toggle-item">
                        <span class="toggle-label">Debug Overlay</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="debugToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="button-group" style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="centerServos()">
                        🎯 Center
                    </button>
                </div>
            </div>
            
            <!-- Manual Control -->
            <div class="panel-card">
                <h3>🎮 Manual Control</h3>
                <div class="joystick-container">
                    <div class="joystick">
                        <div></div>
                        <button class="joystick-btn" onclick="moveServo('up')">▲</button>
                        <div></div>
                        <button class="joystick-btn" onclick="moveServo('left')">◀</button>
                        <button class="joystick-btn center" onclick="centerServos()">●</button>
                        <button class="joystick-btn" onclick="moveServo('right')">▶</button>
                        <div></div>
                        <button class="joystick-btn" onclick="moveServo('down')">▼</button>
                        <div></div>
                    </div>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="panel-card">
                <h3>📊 Status</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="faceStatus">--</div>
                        <div class="stat-label">Face Detected</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="gpioStatus">--</div>
                        <div class="stat-label">GPIO Status</div>
                    </div>
                </div>
            </div>
        </aside>
    </main>
    
    <footer>
        Face Tracking System • Raspberry Pi • OpenCV + PID Control
    </footer>
    
    <script>
        // State
        let currentPan = 90;
        let currentTilt = 90;
        const MOVE_STEP = 5;
        
        // Update status periodically
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // Update connection status
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                statusDot.classList.remove('inactive');
                statusDot.classList.add('active');
                statusText.textContent = 'Connected';
                
                // Update servo gauges
                currentPan = data.pan_angle;
                currentTilt = data.tilt_angle;
                updateGauge('panGauge', 'panValue', currentPan);
                updateGauge('tiltGauge', 'tiltValue', currentTilt);
                
                // Update stats
                document.getElementById('faceStatus').textContent = data.face_detected ? '✓ Yes' : '✗ No';
                document.getElementById('faceStatus').style.color = data.face_detected ? '#10b981' : '#ef4444';
                
                document.getElementById('gpioStatus').textContent = data.gpio_available ? '✓ Active' : '⚠ Sim';
                document.getElementById('gpioStatus').style.color = data.gpio_available ? '#10b981' : '#f59e0b';
                
            } catch (error) {
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                statusDot.classList.remove('active');
                statusDot.classList.add('inactive');
                statusText.textContent = 'Disconnected';
            }
        }
        
        function updateGauge(gaugeId, valueId, angle) {
            const gauge = document.getElementById(gaugeId);
            const value = document.getElementById(valueId);
            
            // Map angle (0-180) to gauge angle (0-360)
            const gaugeAngle = (angle / 180) * 360;
            gauge.style.setProperty('--angle', `${gaugeAngle}deg`);
            value.textContent = `${Math.round(angle)}°`;
        }
        
        // Toggle handlers
        document.getElementById('trackingToggle').addEventListener('change', async (e) => {
            await fetch('/api/tracking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: e.target.checked })
            });
        });
        
        document.getElementById('debugToggle').addEventListener('change', async (e) => {
            await fetch('/api/debug', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: e.target.checked })
            });
        });
        
        // Center servos
        async function centerServos() {
            await fetch('/api/center', { method: 'POST' });
        }
        
        // Manual servo control
        async function moveServo(direction) {
            let pan = currentPan;
            let tilt = currentTilt;
            
            switch(direction) {
                case 'up': tilt = Math.min(150, tilt + MOVE_STEP); break;
                case 'down': tilt = Math.max(30, tilt - MOVE_STEP); break;
                case 'left': pan = Math.min(180, pan + MOVE_STEP); break;
                case 'right': pan = Math.max(0, pan - MOVE_STEP); break;
            }
            
            await fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan, tilt, disable_tracking: true })
            });
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': moveServo('up'); e.preventDefault(); break;
                case 'ArrowDown': moveServo('down'); e.preventDefault(); break;
                case 'ArrowLeft': moveServo('left'); e.preventDefault(); break;
                case 'ArrowRight': moveServo('right'); e.preventDefault(); break;
                case ' ': centerServos(); e.preventDefault(); break;
            }
        });
        
        // Start updates
        setInterval(updateStatus, 500);
        updateStatus();
    </script>
</body>
</html>
